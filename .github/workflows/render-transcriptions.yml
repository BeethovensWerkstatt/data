# documentation awaits instantiation

name: Generate and cache diplomatic, annotated, and fluid transcriptions

on:
  push:
    branches: 
      - 'dev'
    paths:
      - 'data/sources/**/annotatedTranscripts/**/*.xml'
      - 'data/sources/**/diplomaticTranscripts/**/*.xml'
  workflow_dispatch:

jobs:
  build:
    name: Generate Cache files
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: render-transcriptions
      cancel-in-progress: true

    steps:
      - name: Checkout data repository
        uses: actions/checkout@v5
        with:
          path: ./data
          fetch-depth: 0  # Vollständige Git-Historie abrufen

      - name: Checkout cache repository
        uses: actions/checkout@v5
        with:
          repository: BeethovensWerkstatt/data-cache
          token: ${{ secrets.GH_VOIGT_TOKEN }}
          path: ./data-cache
          ref: main

      - name: Geänderte Dateien ermitteln
        id: changed-files
        run: |
          {
            echo 'files<<EOF'
            git -C ./data/.git log --since="$(git -C ./data-cache/.git show -s --format=%cI HEAD)" --name-only --pretty=format: -- ':(glob)**/*[ad]t.xml' | sed '/^$/d' | sort -u | while read f ; do echo "/usr/src/app/data/$f" ; done
            echo 'EOF'
          } >>"$GITHUB_OUTPUT"
        # uses: tj-actions/changed-files@v47
        # with:
        #   path: ./data
        #   files: |
        #     **/*_dt.xml
        #     **/*_at.xml

      - name: run Docker image
        run: docker run --rm -v $(pwd)/data:/usr/src/app/data -v $(pwd)/data-cache/cache:/usr/src/app/cache ghcr.io/beethovenswerkstatt/liquifier:latest node index.js --recreate=true --context-document=Notirungsbuch_K --types=at,dt,fluidTranscripts,editedAt --media=svg,midi --input-dir=/usr/src/app/data/data/sources --output-dir=/usr/src/app/cache ${{ steps.changed-files.outputs.files }}

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain cache)" ]
          then
            git add cache
            git commit -m "Update cached data from data-repository"
            git push origin main
          fi
        working-directory: ./data-cache
